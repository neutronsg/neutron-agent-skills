name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: node scripts/check.mjs
        if: github.event_name != 'pull_request'
      - run: node scripts/check.mjs --base origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
